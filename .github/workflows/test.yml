name: Host Tests

on:
  pull_request:
  push:
    branches: [ "feat/engage", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Run host-side tests
        run: make test